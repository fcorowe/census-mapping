<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Census Mapping Slides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #f7f7f7;
        color: #2e2e2e;
        font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
      }

      .wrap {
        position: relative;
        height: 100%;
        border-right: 1px solid #d4d4d4;
        overflow: hidden;
      }

      .slide {
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 48px 36px 72px;
      }

      .slide.centered {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .intro-block {
        max-width: 470px;
        margin-top: -4vh;
      }

      .intro-title {
        margin: 0 0 16px;
        font-size: 3rem;
        line-height: 1.15;
        font-weight: 400;
        font-style: italic;
        color: #3b3b3b;
      }

      .logo-box {
        display: inline-block;
        background: #fff;
        border: 1px solid #e6e6e6;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
        padding: 8px 16px;
        margin: 0 0 16px;
      }

      .logo-box img {
        width: 220px;
        max-width: 100%;
        display: block;
      }

      .intro-sub {
        margin: 0;
        font-size: 2rem;
        line-height: 1.2;
        font-weight: 400;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 2.1rem;
        line-height: 1.2;
        font-weight: 700;
      }

      p, li {
        margin: 0 0 12px;
        font-size: 1.2rem;
        line-height: 1.45;
      }

      ul {
        margin: 0;
        padding-left: 1.3rem;
      }

      .controls {
        position: absolute;
        right: 12px;
        bottom: 10px;
        width: 74px;
        height: 74px;
        pointer-events: none;
      }

      .navbtn {
        width: 28px;
        height: 28px;
        border: 0;
        background: transparent;
        cursor: pointer;
        position: absolute;
        pointer-events: auto;
        opacity: 0.9;
      }

      .navbtn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }

      .nav-left { left: 0; top: 23px; }
      .nav-right { right: 0; top: 23px; }
      .nav-up { left: 23px; top: 0; }
      .nav-down { left: 23px; bottom: 0; }

      .tri {
        width: 0;
        height: 0;
        border-style: solid;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .nav-left .tri {
        border-width: 9px 13px 9px 0;
        border-color: transparent #d8d8d8 transparent transparent;
      }

      .nav-right .tri {
        border-width: 9px 0 9px 13px;
        border-color: transparent transparent transparent #565656;
      }

      .nav-up .tri {
        border-width: 0 9px 13px 9px;
        border-color: transparent transparent #ececec transparent;
      }

      .nav-down .tri {
        border-width: 13px 9px 0 9px;
        border-color: #ececec transparent transparent transparent;
      }

      @media (max-width: 960px) {
        .slide {
          padding: 26px 20px 52px;
        }

        .intro-title {
          font-size: 2.2rem;
        }

        .intro-sub {
          font-size: 1.65rem;
        }

        h1 {
          font-size: 1.65rem;
        }

        p, li {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="slide" id="slide"></section>

      <div class="controls" aria-hidden="true">
        <button id="up" class="navbtn nav-up" aria-label="Up" disabled><span class="tri"></span></button>
        <button id="right" class="navbtn nav-right" aria-label="Next"><span class="tri"></span></button>
        <button id="left" class="navbtn nav-left" aria-label="Previous"><span class="tri"></span></button>
        <button id="down" class="navbtn nav-down" aria-label="Down" disabled><span class="tri"></span></button>
      </div>
    </div>

    <script>
      const slides = [
        {
          centered: true,
          html: `
            <div class="intro-block">
              <h1 class="intro-title">Where the students live...</h1>
              <div class="logo-box"><img src="figs/logo.png" alt="University of Liverpool" /></div>
              <p class="intro-sub">Applicant Discovery Day<br/>Computer Mapping</p>
            </div>
          `
        },
        {
          title: "Welcome",
          body: `
            <p>Welcome to the computer mapping session!!! In the next few minutes, you will go on a whirlwind tour that will allow you to <b>discover</b> the city of <b>Liverpool</b> using <b>spatial data</b>. In the process, you will get to play with some of the most exciting technology to make maps.</p>
            <p>Move through the notes by navigating the arrows.</p>
            <p><b>Let's start!!!</b></p>
          `
        },
        {
          title: "Population density",
          body: `
            <p>Spatial data are displayed in layers. Each layer displays a different variable for Liverpool.</p>
            <ul>
              <li>At the minute, population density is the only visible layer on the map.</li>
              <li><b>Population density</b> takes the number of people who live in each area and divides it by the size of the area (km2 in our case).</li>
              <li>The map is coloured based on these values, with lighter values representing greater density.</li>
              <li>Which areas of Liverpool have the highest population density? Why might this be?</li>
            </ul>
          `
        },
        {
          title: "OAC",
          body: `
            <p>Let's peel off the population density layer and move to the next layer.</p>
            <p>Welcome to the <b>Output Area Classification</b> (OAC) which is a neighborhood classification that caracterises the geographic socio-economic structure of our society.</p>
            <p>Neighbourhood classifications are data-driven descriptions of places. Using large amounts of quantitative information, we can draw empirical portraits of the character of an area.</p>
          `
        },
        {
          title: "Explore the classifications",
          body: `
            <p>Zoom into different areas and click on areas to find out what category they belong to.</p>
            <p>For a description of each group, move to the next slide.</p>
          `
        },
        {
          title: "OAC groups (pt. I)",
          body: `
            <ul>
              <li><b>Retired Professionals</b>: Typically married but no longer with resident dependent children and well-educated. Detached and semi-detached properties predominate. Rural lifestyle, typically sustained by using two or more cars per household.</li>
              <li><b>Suburbanites and Peri-Urbanites</b>: Typically own (or are buying) their detached, semi-detached or terraced homes. Typically educated to A Level/Highers or degree level. Typically born in the UK. Pervasive in suburban locations and at or beyond the edge of cities.</li>
              <li><b>Multicultural and Educated Urbanites</b>: Typically established populations comprising ethnic minorities together with persons born outside the UK. While generally well-educated, there is low levels of home ownership. Single person households are common. Predominates in Inner London, with smaller enclaves in many other densely populated metropolitan areas.</li>
              <li><b>Low-Skilled Migrant and Student Communities</b>: Young adults, many of whom are students, predominate in these high-density neighbourhoods of rented terrace houses or flats. Most ethnic minorities are present. Predomincates in non-central urban locations across Britain.</li>
            </ul>
          `
        },
        {
          title: "OAC groups (pt. II)",
          body: `
            <ul>
              <li><b>Diverse Suburban Professionals</b>: Those working within the managerial, professional and administrative occupations typically reflect a wide range of ethnic groups, and reside in detached or semi-detached housing. Found throughout suburban Britain.</li>
              <li><b>Baseline UK</b>: Broad base to the UK's social structure, i.e. the average levels of many neighbourhood characteristics.</li>
              <li><b>Semi- and Un-Skilled Workforce</b>: Living in terraced or semi-detached houses, may have less formal education. Residents are predominantly born in the UK and social rented sector housing is common. Found throughout the UK's conurbations, industrial regions and smaller towns.</li>
              <li><b>Legacy Communities</b>: Typically comprise pockets of flats scattered across the UK, particularly in towns with legacies of heavy industry or in more remote seaside locations.</li>
            </ul>
          `
        },
        {
          title: "Beyond Liverpool",
          body: `
            <p>OAC goes beyond Liverpool to include the entire country.</p>
            <p>Open <a href="https://mapmaker.geods.ac.uk/" target="_blank" rel="noopener noreferrer">this link</a> in a new tab and enter your postcode. Does the neighborhood description match your perception of the place?</p>
          `
        },
        {
          title: "Student population",
          body: `
            <p>Now we shift from OAC to student patterns.</p>
          `
        },
        {
          title: "Landmarks and place",
          body: `
            <p>Use the map to find:</p>
            <ul>
              <li><b>Anfield</b> (look north towards Stanley Park).</li>
              <li><b>Albert Dock</b> (follow the River Mersey into the city centre).</li>
              <li><b>Liverpool John Lennon Airport</b> (try South Liverpool).</li>
            </ul>
          `
        },
        {
          title: "Explore with controls",
          body: `
            <p>Use the controls on the right to filter map values. Try the student-focused metrics and compare how the map changes as you adjust thresholds.</p>
          `
        },
        {
          title: "Questions",
          body: `
            <p>Try to find answers to the following:</p>
            <ul>
              <li>Which area contains the highest number of students in Liverpool?</li>
              <li>Where are the two main areas where students live in Liverpool? Why might students be attracted to these areas?</li>
              <li>How does the spatial distribution of students relate to patterns in population density?</li>
              <li>Why might some places be visible on the map but have no student counts?</li>
            </ul>
          `
        },
        {
          title: "OAC + students",
          body: `
            <p>Combine OAC and student metrics to answer:</p>
            <ul>
              <li>Which neighborhood types do students live in?</li>
              <li>How are these areas different from the rest of Liverpool?</li>
            </ul>
          `
        },
        {
          title: "Wrap-up",
          body: `
            <p><b>Well done</b> on completing the short practical. This gives you a flavour of mapping and spatial analysis in Liverpool.</p>
            <p>Please use any remaining time to ask questions about the degree or the city itself.</p>
          `
        }
      ];

      let i = 0;
      const slideEl = document.getElementById('slide');
      const left = document.getElementById('left');
      const right = document.getElementById('right');

      function notifyParent() {
        const payload = { type: 'reveal-slide', indexh: i };
        try {
          let w = window;
          while (w && w.parent !== w) {
            if (w.Shiny && typeof w.Shiny.setInputValue === 'function') {
              w.Shiny.setInputValue('slide_indexh', i, { priority: 'event' });
              break;
            }
            w = w.parent;
          }
        } catch (e) {}
        window.parent.postMessage(payload, '*');
      }

      function render() {
        const s = slides[i];
        if (s.centered) {
          slideEl.className = 'slide centered';
          slideEl.innerHTML = s.html;
        } else {
          slideEl.className = 'slide';
          slideEl.innerHTML = `<h1>${s.title}</h1>${s.body}`;
        }
        left.disabled = i === 0;
        right.disabled = i === slides.length - 1;
        notifyParent();
      }

      function step(dir) {
        const n = i + dir;
        if (n < 0 || n >= slides.length) return;
        i = n;
        render();
      }

      left.addEventListener('click', () => step(-1));
      right.addEventListener('click', () => step(1));
      window.addEventListener('keydown', (e) => {
        if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) {
          e.preventDefault();
          step(1);
        }
        if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
          e.preventDefault();
          step(-1);
        }
      });

      render();
    </script>
  </body>
</html>
